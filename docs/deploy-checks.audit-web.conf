# Production deploy checks for the Google Ads audit application.

repo /Users/VladMoloso/seo-audit
remote origin
integration_branch origin/main
perimeter .

suite_command npm test
suite_count_command npm test 2>&1 | awk '$1=="Tests" && $2 ~ /^[0-9]+$/ {n=$2} END{if(n)print n}'
suite_min_tests 450

# This application has no database migration framework. The positive control
# proves that no migration directory exists; any future migration directory
# makes the pre-flight stop until these commands are replaced with real readers.
migration_applied_command test ! -d /Users/VladMoloso/seo-audit/prisma/migrations && printf '1\n'
migration_pending_command find /Users/VladMoloso/seo-audit/prisma/migrations -type f -name '*.sql' -print 2>/dev/null || true

host_command ssh -i /Users/VladMoloso/.ssh/hetzner_devrika root@167.233.98.195
disk_min_gb 10
mem_min_mb 1500

build_step web npm run build
build_marker web Route (app)

# The total log count is the positive control that proves the production log
# reader is alive. The second command reports only new fatal application errors.
error_total_command ssh -i /Users/VladMoloso/.ssh/hetzner_devrika root@167.233.98.195 "cid=\$(docker ps -q --filter label=coolify.applicationId=2 | head -1); test -n \"\$cid\" && docker logs \"\$cid\" 2>&1 | wc -l"
error_new_command ssh -i /Users/VladMoloso/.ssh/hetzner_devrika root@167.233.98.195 "cid=\$(docker ps -q --filter label=coolify.applicationId=2 | head -1); test -n \"\$cid\" && docker logs --since \"$DEPLOY_CHECKS_SINCE\" \"\$cid\" 2>&1 | grep -Ei 'uncaught|unhandled|fatal|error:' || true"

state_dir /Users/VladMoloso/.codex/state/deploy-checks/audit-web
